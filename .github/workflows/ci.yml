name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        # 依赖清单在仓库根目录；pytest 与覆盖率插件未列入其中，单独安装。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        # pytest.ini 在 backend/ 下（覆盖率门槛也在这里），因此在该目录运行。
        working-directory: backend
        run: pytest

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # 缓存键按前端自己的 lock 文件算，与根目录无关
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # eslint + eslint-config-next（Next 16 起 next lint 子命令已移除，规则集相同）。
        run: npm run lint
      - name: Type check
        # 只跑 tsc、不跑 next build：构建要数倍时间且需要完整 Next 环境（含页面数据依赖），
        # 而本项目前端的绝大多数回归（props 不匹配、类型漂移）类型检查就能拦住。
        run: npx tsc --noEmit